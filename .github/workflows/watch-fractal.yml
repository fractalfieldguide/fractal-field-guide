name: Check for Fractal updates

# Once a day, look for new firmware, Fractal firmware posts on the forum, and edits to the
# wiki pages the guide uses. Opens an issue when something turns up. Never changes the site.
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: watch-fractal

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Get saved state
        run: |
          git fetch --depth=1 origin watch-state && git show origin/watch-state:state.json > state.json || echo "no saved state yet"
      - name: Check sources
        run: python3 .github/watch/watch.py state.json out
      - name: Open an issue if anything is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/title.txt ]; then
            gh issue create --title "$(cat out/title.txt)" --body-file out/body.md
          fi
      - name: Save state
        run: |
          git config user.name "Fractal Field Guide"
          git config user.email "fractalfieldguide@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp state.json "$tmp/"
          cd "$tmp"
          git init -q -b watch-state
          git add state.json
          git commit -qm "Update watcher state"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" watch-state
